<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe vs Computer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: single narrow column; the board is a drawn # grid on squared notebook paper. */
  :root {
    --paper: #eef2f6;
    --card: #ffffff;
    --ink: #1c2633;
    --muted: #5f6b7a;
    --rule: #d5dde6;
    --grid: #2b3644;
    --x: #c92a2a;
    --o: #1864ab;
    --accent: #0b7285;
    --on-accent: #ffffff;
    --win: #fff3bf;
    --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12171e; --card: #1b222c; --ink: #e8edf3; --muted: #9aa6b4;
      --rule: #2a3340; --grid: #c6d0dc; --x: #ff8787; --o: #74c0fc;
      --accent: #3bc9db; --on-accent: #0b1a1f; --win: #3d3510; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12171e; --card: #1b222c; --ink: #e8edf3; --muted: #9aa6b4;
    --rule: #2a3340; --grid: #c6d0dc; --x: #ff8787; --o: #74c0fc;
    --accent: #3bc9db; --on-accent: #0b1a1f; --win: #3d3510; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font: 15px/1.5 var(--body);
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { margin: 0; font: 700 2rem/1.1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    gap: 16px;
  }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  legend { font: 600 0.75rem var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
  .level {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; border: 1px solid var(--rule); border-radius: 10px; cursor: pointer;
  }
  .level:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .level input { margin-top: 4px; accent-color: var(--accent); }
  .level b { font-family: var(--display); font-weight: 700; }
  .level small { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  button {
    font: 600 1rem var(--body);
    background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; width: 100%;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  button:focus-visible { outline: 3px solid var(--o); outline-offset: 2px; }

  .status { font: 700 1.2rem var(--display); min-height: 1.5em; margin: 0; text-align: center; }
  .meta { color: var(--muted); text-align: center; margin: -10px 0 0; font-size: 0.85rem; }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr);
    aspect-ratio: 1; max-width: 100%; margin: 4px 8px;
  }
  .cell {
    background: transparent; border: 0; border-radius: 6px; padding: 0; width: auto;
    font: 700 clamp(2.6rem, 15vw, 4.2rem)/1 var(--display);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); cursor: pointer;
  }
  .cell:nth-child(-n+6) { border-bottom: 3px solid var(--grid); border-radius: 0; }
  .cell:not(:nth-child(3n)) { border-right: 3px solid var(--grid); border-radius: 0; }
  .cell:disabled { cursor: default; }
  .cell:not(:disabled):hover { background: var(--paper); }
  .cell.X { color: var(--x); }
  .cell.O { color: var(--o); }
  .cell.X, .cell.O { animation: drop 180ms ease-out; }
  .cell.win { background: var(--win); }
  @keyframes drop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cell.X, .cell.O { animation: none; } }
  .score { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-top: 1px solid var(--rule); padding-top: 14px; }
  .score b { display: block; font: 700 1.5rem var(--display); font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); font-size: 0.8rem; }
  .actions { display: flex; gap: 8px; }
  .hidden { display: none; }
</style>

</head>
<body>
<main>
  <header>
    <h1>Tic-Tac-Toe</h1>
    <p class="sub">You against the computer. A coin toss decides who begins.</p>
  </header>

  <section id="setup" class="panel">
    <fieldset>
      <legend>Computer level</legend>
      <label class="level">
        <input type="radio" id="lvl-beginner" name="level" value="beginner" checked>
        <span><b>Beginner</b><small>Plays completely random moves.</small></span>
      </label>
      <label class="level">
        <input type="radio" id="lvl-average" name="level" value="average">
        <span><b>Average</b><small>Plays defensively: takes a winning square and blocks your threats. When it begins, its first move is random.</small></span>
      </label>
    </fieldset>
    <button id="start">Start game</button>
  </section>

  <section id="game" class="panel hidden">
    <p class="status" id="status"></p>
    <p class="meta" id="meta"></p>
    <div class="board" id="board" aria-label="Tic-tac-toe board"></div>
    <div class="score">
      <div><b id="sYou">0</b><span>You (X)</span></div>
      <div><b id="sDraw">0</b><span>Draws</span></div>
      <div><b id="sCpu">0</b><span>Computer (O)</span></div>
    </div>
    <div class="actions">
      <button id="again">Play again</button>
      <button id="change" class="secondary">Change level</button>
    </div>
  </section>
</main>

<script>
const HUMAN = 'X', CPU = 'O';
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board, level, current, over, cpuStarted, timer;
const score = { you: 0, draw: 0, cpu: 0 };

const $ = id => document.getElementById(id);
const boardEl = $('board');
const cells = [];
for (let i = 0; i < 9; i++) {
  const b = document.createElement('button');
  b.className = 'cell';
  b.setAttribute('aria-label', `Square ${i + 1}`);
  b.addEventListener('click', () => humanMove(i));
  boardEl.appendChild(b);
  cells.push(b);
}

function winner(b) {
  for (const line of LINES) {
    const [a, c, d] = line;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line };
  }
  return b.every(Boolean) ? { player: null, line: [] } : null;
}

const empty = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Square that would complete a line for `player`, or -1.
function completingSquare(b, player) {
  for (const sq of empty(b)) {
    const t = b.slice(); t[sq] = player;
    if (winner(t)?.player === player) return sq;
  }
  return -1;
}

// ----- Computer levels -----
const strategies = {
  // Beginner: purely random.
  beginner: b => pick(empty(b)),

  // Average: defensive. If the computer starts, its very first move is random.
  // Otherwise: finish its own line if possible, else block the human, else random.
  average: b => {
    const cpuMoves = b.filter(v => v === CPU).length;
    if (cpuStarted && cpuMoves === 0) return pick(empty(b));
    const win = completingSquare(b, CPU);
    if (win >= 0) return win;
    const block = completingSquare(b, HUMAN);
    if (block >= 0) return block;
    return pick(empty(b));
  }
};

function render() {
  const w = winner(board);
  board.forEach((v, i) => {
    cells[i].textContent = v || '';
    cells[i].className = 'cell' + (v ? ' ' + v : '') + (w?.line.includes(i) ? ' win' : '');
    cells[i].disabled = over || !!v || current !== HUMAN;
  });
}

function setStatus(text) { $('status').textContent = text; }

function finish(w) {
  over = true;
  clearTimeout(timer);
  if (w.player === HUMAN) { score.you++; setStatus('You win!'); }
  else if (w.player === CPU) { score.cpu++; setStatus('The computer wins.'); }
  else { score.draw++; setStatus("It's a draw."); }
  $('sYou').textContent = score.you;
  $('sDraw').textContent = score.draw;
  $('sCpu').textContent = score.cpu;
  render();
}

function afterMove() {
  const w = winner(board);
  if (w) return finish(w);
  current = current === HUMAN ? CPU : HUMAN;
  render();
  if (current === CPU) {
    setStatus('Computer is thinking…');
    timer = setTimeout(cpuMove, 450);
  } else {
    setStatus('Your turn — you are X.');
  }
}

function humanMove(i) {
  if (over || current !== HUMAN || board[i]) return;
  board[i] = HUMAN;
  afterMove();
}

function cpuMove() {
  if (over) return;
  board[strategies[level](board)] = CPU;
  afterMove();
}

function newGame() {
  clearTimeout(timer);
  board = Array(9).fill(null);
  over = false;
  cpuStarted = Math.random() < 0.5;   // coin toss
  current = cpuStarted ? CPU : HUMAN;
  const name = level[0].toUpperCase() + level.slice(1);
  $('meta').textContent = `Level: ${name} · Coin toss: ${cpuStarted ? 'computer' : 'you'} begin${cpuStarted ? 's' : ''}`;
  render();
  if (cpuStarted) { setStatus('Computer begins…'); timer = setTimeout(cpuMove, 650); }
  else setStatus('You begin — you are X.');
}

$('start').addEventListener('click', () => {
  level = document.querySelector('input[name=level]:checked').value;
  $('setup').classList.add('hidden');
  $('game').classList.remove('hidden');
  newGame();
});
$('again').addEventListener('click', newGame);
$('change').addEventListener('click', () => {
  over = true;
  clearTimeout(timer);
  $('game').classList.add('hidden');
  $('setup').classList.remove('hidden');
});
</script>
</body>
</html>
